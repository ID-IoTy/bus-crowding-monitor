[project]
name = "bus-crowding-monitor"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "websockets==15.0.1", "sqlalchemy==2.0.40", "pydantic==2.11.3", "httpx==0.28.1", "numpy==2.2.5", "pyyaml==6.0.2", "tzdata==2025.2"]
[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.7"]
[tool.ruff]
line-length = 110
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

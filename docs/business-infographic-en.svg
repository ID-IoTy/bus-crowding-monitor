<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2025" width="1200" height="2025" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Bus Crowding Monitor - Business plan</title>
  <desc id="d">Infographic: ESP32-S3 and LoRa stop kit, LoRaWAN connectivity with a 4G gateway, four-phase rollout, 20-stop pilot budget, return-on-investment levers and recommendations.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5a6a"/>
    </marker>
  </defs>
  <style>
    .h1{font-size:40px;font-weight:700;fill:#fff}
    .sub{font-size:19px;fill:#e3e9f1}
    .sub2{font-size:14px;fill:#9fb3c8}
    .sec{font-size:24px;font-weight:700;fill:#0f2a44}
    .secn{font-size:14px;fill:#6b7a89}
    .ct{font-size:20px;font-weight:700;fill:#fff}
    .cs{font-size:14px;fill:#fff}
    .row{font-size:14px;fill:#22313f}
    .price{font-size:14px;font-weight:700;fill:#22313f}
    .colh{font-size:13px;font-weight:700;fill:#6b7a89}
    .tot{font-size:22px;font-weight:700}
    .note{font-size:13px;fill:#3d4b59}
    .small{font-size:12px;fill:#6b7a89}
    .wb{font-size:15px;font-weight:700;fill:#fff}
    .ws{font-size:12px;fill:#e3e9f1}
    .bb{font-size:15px;font-weight:700;fill:#0f2a44}
    .bs{font-size:12px;fill:#4a5a6a}
    .pt{font-size:17px;font-weight:700;fill:#0f2a44}
    .pw{font-size:13px;font-weight:700;fill:#2a6fb5}
    .tip{font-size:16px;font-weight:700;fill:#0f2a44}
  </style>

  <rect width="1200" height="2025" fill="#f4f6f9"/>

  <!-- Header -->
  <rect width="1200" height="160" fill="#0f2a44"/>
  <text x="40" y="70" class="h1">Bus Crowding Monitor</text>
  <text x="40" y="106" class="sub">Business plan: stop kit, connectivity and phased rollout</text>
  <text x="40" y="136" class="sub2">GTT Turin · lines 33 and 42 · from passive measurement to predictive management</text>
  <rect x="930" y="35" width="230" height="90" rx="12" fill="#f08a24"/>
  <text x="1045" y="80" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">≈ €1.2-1.6k</text>
  <text x="1045" y="106" text-anchor="middle" font-size="14" fill="#fff">pilot · 20 stops · hardware</text>
  <rect x="0" y="160" width="300" height="8" fill="#2e9d5b"/>
  <rect x="300" y="160" width="300" height="8" fill="#f2c230"/>
  <rect x="600" y="160" width="300" height="8" fill="#f08a24"/>
  <rect x="900" y="160" width="300" height="8" fill="#d64545"/>

  <!-- 1. Stop kit -->
  <text x="40" y="215" class="sec">1 · Stop kit</text>
  <text x="200" y="215" class="secn">hardware estimate, excl. VAT</text>

  <rect x="40" y="235" width="1120" height="320" rx="14" fill="#fff" stroke="#dde3ea"/>
  <rect x="40" y="235" width="1120" height="70" rx="14" fill="#2e9d5b"/>
  <rect x="40" y="285" width="1120" height="20" fill="#2e9d5b"/>
  <text x="60" y="267" class="ct">XIAO ESP32-S3 SENSE + LORA</text>
  <text x="60" y="291" class="cs">Self-powered: solar, no cables, no grid connection</text>

  <text x="60" y="340" class="row">XIAO ESP32-S3 Sense (camera included)</text><text x="580" y="340" text-anchor="end" class="price">€13</text>
  <text x="60" y="370" class="row">Wio-SX1262 LoRa module</text><text x="580" y="370" text-anchor="end" class="price">€5</text>
  <text x="60" y="400" class="row">PIR sensor (wake-up)</text><text x="580" y="400" text-anchor="end" class="price">€1</text>
  <text x="60" y="430" class="row">5 W panel + 2 × 18650 cells + charge controller</text><text x="580" y="430" text-anchor="end" class="price">€12</text>
  <text x="60" y="460" class="row">IP65 ABS enclosure + pole strap</text><text x="580" y="460" text-anchor="end" class="price">€6</text>
  <line x1="60" y1="480" x2="580" y2="480" stroke="#dde3ea"/>
  <text x="60" y="520" class="tot" fill="#22313f">Total per stop</text><text x="580" y="520" text-anchor="end" class="tot" fill="#2e9d5b">€37</text>

  <line x1="615" y1="325" x2="615" y2="535" stroke="#dde3ea"/>
  <text x="640" y="340" class="bb">How it works</text>
  <text x="640" y="378" class="note">On-device TinyML counting: images never leave the board</text>
  <text x="640" y="412" class="note">The PIR wakes the camera only when needed: ~0.2 W average</text>
  <text x="640" y="446" class="note">LoRa uplink every 30-60 s with the updated count</text>
  <text x="640" y="480" class="note">Strap-mounted on the stop pole</text>

  <!-- 2. Connectivity -->
  <text x="40" y="610" class="sec">2 · LoRaWAN connectivity</text>
  <text x="335" y="610" class="secn">one 4G gateway serves every pilot stop</text>
  <rect x="40" y="630" width="1120" height="260" rx="14" fill="#fff" stroke="#dde3ea"/>

  <rect x="70" y="650" width="170" height="46" rx="8" fill="#e8f0fa" stroke="#2a6fb5"/>
  <text x="155" y="670" text-anchor="middle" class="bb">Stop 1</text><text x="155" y="687" text-anchor="middle" class="bs">ESP32 + LoRa kit</text>
  <rect x="70" y="712" width="170" height="46" rx="8" fill="#e8f0fa" stroke="#2a6fb5"/>
  <text x="155" y="732" text-anchor="middle" class="bb">Stop 2</text><text x="155" y="749" text-anchor="middle" class="bs">ESP32 + LoRa kit</text>
  <rect x="70" y="774" width="170" height="46" rx="8" fill="#e8f0fa" stroke="#2a6fb5"/>
  <text x="155" y="794" text-anchor="middle" class="bb">… Stop 20</text><text x="155" y="811" text-anchor="middle" class="bs">ESP32 + LoRa kit</text>

  <line x1="240" y1="673" x2="378" y2="725" stroke="#4a5a6a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="240" y1="735" x2="378" y2="735" stroke="#4a5a6a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="240" y1="797" x2="378" y2="745" stroke="#4a5a6a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="310" y="663" text-anchor="middle" class="small">~10 bytes / msg</text>

  <rect x="380" y="690" width="210" height="90" rx="10" fill="#0f2a44"/>
  <text x="485" y="722" text-anchor="middle" class="wb">LoRaWAN + 4G gateway</text>
  <text x="485" y="744" text-anchor="middle" class="ws">outdoor · ~€350 · 1 or 2</text>
  <text x="485" y="764" text-anchor="middle" class="ws">urban range 1-3 km</text>

  <line x1="590" y1="735" x2="648" y2="735" stroke="#4a5a6a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="619" y="724" text-anchor="middle" class="small">4G</text>

  <rect x="650" y="690" width="200" height="90" rx="10" fill="#fff" stroke="#0f2a44" stroke-width="2"/>
  <text x="750" y="722" text-anchor="middle" class="bb">Network server</text>
  <text x="750" y="744" text-anchor="middle" class="bs">self-hosted ChirpStack</text>
  <text x="750" y="764" text-anchor="middle" class="bs">or The Things Network</text>

  <line x1="850" y1="735" x2="908" y2="735" stroke="#4a5a6a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="879" y="724" text-anchor="middle" class="small">webhook</text>

  <rect x="910" y="690" width="230" height="90" rx="10" fill="#2a6fb5"/>
  <text x="1025" y="722" text-anchor="middle" class="wb">Server :8000</text>
  <text x="1025" y="744" text-anchor="middle" class="ws">/ingest/camera/observation</text>
  <text x="1025" y="764" text-anchor="middle" class="ws">fusion + predictions</text>

  <text x="70" y="842" class="note">• Minimal payload (stop_id, count, trigger, time): no image ever leaves the stop.</text>
  <text x="70" y="864" class="note">• One count every 30-60 s per stop, ~10 bytes per message: within the EU868 duty cycle.</text>
  <text x="70" y="886" class="note">• The 4G gateway needs no fibre or city network: just a power socket and a high mounting point.</text>

  <!-- 3. Rollout -->
  <text x="40" y="945" class="sec">3 · Phased rollout</text>
  <text x="250" y="945" class="secn">start where the problem is concentrated, expand where data justifies it</text>
  <line x1="160" y1="990" x2="1030" y2="990" stroke="#9fb3c8" stroke-width="4"/>
  <circle cx="160" cy="990" r="22" fill="#8fb3d9"/><text x="160" y="997" text-anchor="middle" class="wb">0</text>
  <circle cx="450" cy="990" r="22" fill="#4f86c6"/><text x="450" y="997" text-anchor="middle" class="wb">1</text>
  <circle cx="740" cy="990" r="22" fill="#2a5f9e"/><text x="740" y="997" text-anchor="middle" class="wb">2</text>
  <circle cx="1030" cy="990" r="22" fill="#0f2a44"/><text x="1030" y="997" text-anchor="middle" class="wb">3</text>

  <rect x="40" y="1025" width="250" height="195" rx="12" fill="#fff" stroke="#dde3ea"/>
  <text x="60" y="1055" class="pt">Demo</text>
  <text x="60" y="1076" class="pw">today · hackathon</text>
  <text x="60" y="1105" class="note">1 physical stop (prototype)</text>
  <text x="60" y="1126" class="note">+ simulator for lines 33/42</text>
  <text x="60" y="1155" class="note">Goal: show that</text>
  <text x="60" y="1176" class="note">predictions react to</text>
  <text x="60" y="1197" class="note">real counts</text>

  <rect x="325" y="1025" width="250" height="195" rx="12" fill="#fff" stroke="#dde3ea"/>
  <text x="345" y="1055" class="pt">Pilot</text>
  <text x="345" y="1076" class="pw">3-6 months</text>
  <text x="345" y="1105" class="note">20 stops on lines 33/42</text>
  <text x="345" y="1126" class="note">1-2 LoRaWAN + 4G gateways</text>
  <text x="345" y="1155" class="note">KPI: calibrated confidence</text>
  <text x="345" y="1176" class="note">within ±10 points on</text>
  <text x="345" y="1197" class="note">real data, not just simulated</text>

  <rect x="615" y="1025" width="250" height="195" rx="12" fill="#fff" stroke="#dde3ea"/>
  <text x="635" y="1055" class="pt">Critical lines</text>
  <text x="635" y="1076" class="pw">6-18 months</text>
  <text x="635" y="1105" class="note">100-200 stops selected</text>
  <text x="635" y="1126" class="note">using GTT APC data</text>
  <text x="635" y="1155" class="note">KPI: lost demand</text>
  <text x="635" y="1176" class="note">measured, trips and</text>
  <text x="635" y="1197" class="note">vehicles reallocated</text>

  <rect x="905" y="1025" width="255" height="195" rx="12" fill="#fff" stroke="#dde3ea"/>
  <text x="925" y="1055" class="pt">Network + GTFS-RT</text>
  <text x="925" y="1076" class="pw">18+ months</text>
  <text x="925" y="1105" class="note">Rollout in waves</text>
  <text x="925" y="1126" class="note">and move to wired power</text>
  <text x="925" y="1155" class="note">Crowding shown in Google</text>
  <text x="925" y="1176" class="note">Maps, Apple Maps, Moovit,</text>
  <text x="925" y="1197" class="note">with no dedicated app</text>

  <rect x="40" y="1240" width="1120" height="58" rx="10" fill="#e8f0fa"/>
  <text x="60" y="1264" class="row"><tspan font-weight="700">How to choose stops:</tspan> rank them by APC boardings × frequency of buses departing full (departed_full).</text>
  <text x="60" y="1285" class="row">A few stops concentrate most of the problem: that is where the cost per passenger served is lowest.</text>

  <!-- 4. Budget -->
  <text x="40" y="1350" class="sec">4 · Pilot budget</text>
  <text x="225" y="1350" class="secn">20 stops, hardware only</text>
  <rect x="40" y="1365" width="550" height="255" rx="14" fill="#fff" stroke="#dde3ea"/>
  <text x="440" y="1392" text-anchor="end" class="colh">1 gateway</text>
  <text x="570" y="1392" text-anchor="end" class="colh">2 gateways</text>
  <text x="60" y="1420" class="row">20 × stop kit (€37)</text><text x="440" y="1420" text-anchor="end" class="price">€740</text><text x="570" y="1420" text-anchor="end" class="price">€740</text>
  <text x="60" y="1448" class="row">Outdoor LoRaWAN + 4G gateway (~€350)</text><text x="440" y="1448" text-anchor="end" class="price">€350</text><text x="570" y="1448" text-anchor="end" class="price">€700</text>
  <text x="60" y="1476" class="row">IoT 4G SIM, 12 months (~€5/month)</text><text x="440" y="1476" text-anchor="end" class="price">€60</text><text x="570" y="1476" text-anchor="end" class="price">€120</text>
  <text x="60" y="1504" class="row">ChirpStack network server (open source)</text><text x="440" y="1504" text-anchor="end" class="price">€0</text><text x="570" y="1504" text-anchor="end" class="price">€0</text>
  <line x1="60" y1="1522" x2="570" y2="1522" stroke="#dde3ea"/>
  <text x="60" y="1555" class="tot" fill="#22313f">Total</text><text x="440" y="1555" text-anchor="end" class="tot" fill="#2e9d5b">≈ €1,150</text><text x="570" y="1555" text-anchor="end" class="tot" fill="#f08a24">≈ €1,560</text>
  <text x="60" y="1585" class="small">1 gateway: stops within ~2 km of a high point. 2: full section + redundancy.</text>
  <text x="60" y="1603" class="small">Installation and permits excluded.</text>

  <!-- 5. ROI -->
  <text x="610" y="1350" class="sec">5 · Return on investment</text>
  <rect x="610" y="1365" width="550" height="255" rx="14" fill="#fff" stroke="#dde3ea"/>
  <circle cx="645" cy="1399" r="14" fill="#d64545"/><text x="645" y="1404" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="672" y="1397" class="bb">Lost demand</text>
  <text x="672" y="1417" class="note">left behind × fare = lost revenue, invisible to APC</text>
  <circle cx="645" cy="1454" r="14" fill="#f08a24"/><text x="645" y="1459" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="672" y="1452" class="bb">Fleet and routes</text>
  <text x="672" y="1472" class="note">vehicles moved from empty trips to chronically crowded stops</text>
  <circle cx="645" cy="1509" r="14" fill="#f2c230"/><text x="645" y="1514" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="672" y="1507" class="bb">Fare evasion</text>
  <text x="672" y="1527" class="note">APC vs ticket validations by line and hour → targeted inspections</text>
  <line x1="630" y1="1545" x2="1140" y2="1545" stroke="#dde3ea"/>
  <text x="630" y="1573" class="bb">Model: hardware-as-a-service + SaaS fee per stop/month</text>
  <text x="630" y="1600" class="small">Payback = network cost / (recovered revenue + km saved + more effective inspections)</text>

  <!-- 6. Recommendations -->
  <text x="40" y="1670" class="sec">6 · More recommendations</text>

  <rect x="40" y="1690" width="360" height="120" rx="12" fill="#fff" stroke="#dde3ea"/>
  <text x="60" y="1720" class="tip">Reuse existing smart poles</text>
  <text x="60" y="1745" class="note">Where GTT already has electronic stop signs,</text>
  <text x="60" y="1765" class="note">camera and display reuse existing power and</text>
  <text x="60" y="1785" class="note">mounts: lower cost, fewer permits.</text>

  <rect x="420" y="1690" width="360" height="120" rx="12" fill="#fff" stroke="#dde3ea"/>
  <text x="440" y="1720" class="tip">Camera-free option</text>
  <text x="440" y="1745" class="note">mmWave radar or low-resolution thermal sensors</text>
  <text x="440" y="1765" class="note">count people without images (€20-60):</text>
  <text x="440" y="1785" class="note">privacy is easier to demonstrate.</text>

  <rect x="800" y="1690" width="360" height="120" rx="12" fill="#fff" stroke="#dde3ea"/>
  <text x="820" y="1720" class="tip">GDPR before the pilot</text>
  <text x="820" y="1745" class="note">Even without storing frames: a DPIA,</text>
  <text x="820" y="1765" class="note">information signs and a clear agreement</text>
  <text x="820" y="1785" class="note">with GTT and the City on privacy roles.</text>

  <rect x="40" y="1825" width="360" height="120" rx="12" fill="#fff" stroke="#dde3ea"/>
  <text x="60" y="1855" class="tip">Local partners</text>
  <text x="60" y="1880" class="note">Torino City Lab for on-street testing,</text>
  <text x="60" y="1900" class="note">5T for mobility data, GTT for APC and AVL:</text>
  <text x="60" y="1920" class="note">the starting data already exist.</text>

  <rect x="420" y="1825" width="360" height="120" rx="12" fill="#fff" stroke="#dde3ea"/>
  <text x="440" y="1855" class="tip">Public funding</text>
  <text x="440" y="1880" class="note">Smart city and public transport calls</text>
  <text x="440" y="1900" class="note">(PN Metro Plus, EU programmes) often fund</text>
  <text x="440" y="1920" class="note">pilots: apply with measured results.</text>

  <rect x="800" y="1825" width="360" height="120" rx="12" fill="#fff" stroke="#dde3ea"/>
  <text x="820" y="1855" class="tip">Maintenance as data</text>
  <text x="820" y="1880" class="note">OTA updates, watchdog, vandal-proof box.</text>
  <text x="820" y="1900" class="note">The SENSOR_STALE alert becomes the</text>
  <text x="820" y="1920" class="note">maintenance ticket for technicians.</text>

  <!-- Footer -->
  <text x="40" y="1978" class="small">Indicative prices, October 2026, excl. VAT, small batches. References: XIAO ESP32-S3 + Wio-SX1262 kit from $10.90 (Seeed); outdoor 4G gateway such as Dragino DLOS8N.</text>
  <text x="40" y="1996" class="small">Installation and permits excluded. Prototype data is simulated.</text>
</svg>
